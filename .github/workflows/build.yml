name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Liaison-windows
          path: dist/*.exe
      - id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Lancement manuel ou tag vX.Y.Z : page de téléchargement (Release) avec les
      # deux exécutables ; le tag est créé à partir de la version de package.json.
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Liaison ${{ steps.version.outputs.tag }}
          files: |
            dist/Liaison-Installation-*.exe
            dist/Liaison-Portable-*.exe
          body: |
            **Liaison-Installation** : installateur Windows (recommandé, crée un raccourci).
            **Liaison-Portable** : s'exécute sans installation (clé USB, poste sans droits admin).
